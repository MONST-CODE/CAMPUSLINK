name: Windows x64
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        working-directory: Campus Link
    steps:
      - uses: actions/checkout@v4
        with:
          path: Campus Link
          persist-credentials: false
      - name: Install hash-verified SDL3, ImGui and LLVM
        shell: powershell
        run: .\scripts\setup-deps.ps1 -InstallPinnedLLVM
      - name: Validate environment
        shell: cmd
        run: call build.bat doctor
      - name: Verify invalid command exit code
        shell: cmd
        run: |
          call build.bat bad-command
          if not "%ERRORLEVEL%"=="2" exit /b 1
          exit /b 0
      - name: CLP1 loopback protocol test
        shell: cmd
        run: python tests\integration\clp1_loopback.py
      - name: Package command
        shell: cmd
        run: call build.bat package
      - name: Build Debug and Release, run tests and verify local release
        shell: cmd
        run: call build.bat release-all
      - name: Expose build evidence on the check run
        if: always()
        shell: powershell
        run: |
          if (Test-Path logs/build) {
            $logs = Get-ChildItem logs/build -Filter '*.log' | Sort-Object LastWriteTime
            foreach ($log in $logs) {
              $hits = Get-Content -LiteralPath $log.FullName | Where-Object { $_ -match '(?i)\[FAIL\]|error:|LNK[0-9]+|SUMMARY|Verified SHA-256|Verified package:|SHA256:|Native inventory:|maximum_completed_within_budgets=' } | Select-Object -Last 13
              foreach ($line in $hits) {
                $message = $line.Trim().Replace('%','%25')
                $level = if ($line -match '(?i)\[FAIL\]|error:|LNK[0-9]+') { 'error' } else { 'notice' }
                Write-Output "::$level title=CAMPUSLINK::$message"
              }
            }
          }
          $checksum = Get-ChildItem dist/releases -Filter SHA256SUMS.txt -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($checksum) { Get-Content -LiteralPath $checksum.FullName | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY }
      - name: Retain artifacts and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campuslink-windows-x64
          path: |
            Campus Link/dist/releases/
            Campus Link/dist/packages/
            Campus Link/logs/build/
